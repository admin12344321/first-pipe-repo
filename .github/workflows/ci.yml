

name: Helm Chart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  validate-chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Lint Helm chart
        run: helm lint ./myapp-chart

      - name: Render Kubernetes manifests
        run: helm template myapp ./myapp-chart


      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build -t ghcr.io/${{ github.repository_owner }}/myapp:${IMAGE_TAG} .


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}      
          
     
      - name: Push Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker push ghcr.io/${{ github.repository_owner }}/myapp:${IMAGE_TAG}


          

        
      - name: Update Helm chart image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          sed -i "s/tag: \".*\"/tag: \"${IMAGE_TAG}\"/" myapp-chart/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add myapp-chart/values.yaml

          if git diff --cached --quiet; then
            echo "Image tag unchanged; nothing to commit."
          else
            git commit -m "chore: update myapp image tag to ${IMAGE_TAG}"
            git push
          fi
  

      run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker push ghcr.io/${{ github.repository_owner }}/myapp:${IMAGE_TAG}
