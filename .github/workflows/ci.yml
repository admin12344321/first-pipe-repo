

name: Helm Chart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1

      - name: Lint Helm chart
        run: helm lint ./myapp-chart

      - name: Render Kubernetes manifests
        run: helm template myapp ./myapp-chart


      - name: Build Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker build -t ghcr.io/${{ github.repository_owner }}/myapp:${IMAGE_TAG} .


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Push Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          docker push ghcr.io/${{ github.repository_owner }}/myapp:${IMAGE_TAG}
