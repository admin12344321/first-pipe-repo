name: Developer Self-Service

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name (e.g. payment-service)"
        required: true
        type: string
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  generate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          APP_NAME: ${{ inputs.app_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ ! "$APP_NAME" =~ ^[a-z][a-z0-9-]{2,30}$ ]]; then
            echo "Invalid application name."
            echo "Use 3-31 lowercase letters, numbers, or hyphens."
            echo "The name must start with a lowercase letter."
            exit 1
          fi

          case "$ENVIRONMENT" in
            development|staging|production)
              echo "Application name and environment are valid."
              ;;
            *)
              echo "Invalid environment."
              exit 1
              ;;
          esac

      - name: Generate application project
        env:
          APP_NAME: ${{ inputs.app_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          export APP_NAME ENVIRONMENT
          mkdir -p "generated-apps/$APP_NAME"

          python3 - <<'PY'
          import os
          from pathlib import Path

          app_name = os.environ["APP_NAME"]
          environment = os.environ["ENVIRONMENT"]

          import shutil

          template_dir = Path("idp/templates/app")
          output_dir = Path("generated-apps") / app_name

          shutil.copytree(
              template_dir,
              output_dir,
              dirs_exist_ok=True,
              ignore=shutil.ignore_patterns("__pycache__", "*.pyc"),
          )

          readme = output_dir / "README.md"
          readme_content = readme.read_text()
          readme_content = readme_content.replace("{{APP_NAME}}", app_name)
          readme_content = readme_content.replace(
              "{{ENVIRONMENT}}", environment
          )
          readme.write_text(readme_content)

          print(f"Generated application project: {output_dir}")
          PY

      - name: Verify generated project
        env:
          APP_NAME: ${{ inputs.app_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          test -s "generated-apps/$APP_NAME/app.py"
          test -s "generated-apps/$APP_NAME/Dockerfile"
          test -s "generated-apps/$APP_NAME/README.md"

          grep -Fq "# $APP_NAME" "generated-apps/$APP_NAME/README.md"
          grep -Fq -- "- Environment: $ENVIRONMENT" \
            "generated-apps/$APP_NAME/README.md"

          if grep -Eq '\{\{(APP_NAME|ENVIRONMENT)\}\}' \
            "generated-apps/$APP_NAME/README.md"; then
            echo "Unreplaced placeholders found in README."
            exit 1
          fi

          python3 -m py_compile "generated-apps/$APP_NAME/app.py"
          rm -rf "generated-apps/$APP_NAME/__pycache__"

          echo "Project generation and validation succeeded."

      - name: Upload generated project
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-project
          path: generated-apps/${{ inputs.app_name }}/
